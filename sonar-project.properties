# Project identification
sonar.projectKey=nexusos-ultra
sonar.organization=your-org-name
sonar.projectName=NexusOS-Ultra
sonar.projectVersion=1.0.0

# Source paths
sonar.sources=.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.git/**,**/node_modules/**,**/.next/**,**/runtime/logs/**,**/runtime/patches/**,**/runtime/exports/**

# Python configuration
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# TypeScript/JavaScript configuration
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Docker configuration
sonar.docker.file.patterns=Dockerfile,**/Dockerfile

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate - Block on critical issues
sonar.qualitygate.wait=true

# Additional rules for security
sonar.security.hotspots.level=HIGH
